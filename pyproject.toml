[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "spacecraft-navigation"
version = "0.1.0"
description = "Autonomous Spacecraft Navigation using GNSS/INS Sensor Fusion and EKF — LEO simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
# Entry points (added per phase as modules are completed)
orbit-baseline = "spacecraft_nav.experiments.orbit_baseline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spacecraft_nav*", "python*"]

[tool.setuptools.package-dir]
spacecraft_nav = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
